{{- /*
StatefulSet, not Deployment: anywhere embeds its relational storage (SQLite on the data PVC,
templates/pvc.yaml), so it is a stateful, single-writer service.
Replicas are fixed at 1 and deliberately not exposed in values — the binary additionally refuses
to start on a non-0 ordinal (single-replica self-check).
*/}}
{{- /* Object storage is required. Failing at render time beats a crash-looping pod — the
     backend enforces the same policy at startup (and additionally probes the bucket). */}}
{{- if not .Values.dependencies.s3.bucket }}
{{- fail "the anywhere chart requires object storage for large artifacts (query profiles, support bundles): configure dependencies.s3 (bucket at minimum; region/endpoint/accessKey/secretKey as your provider requires)" }}
{{- end }}
{{- /* The ops data path is not optional: anywhere serves nothing without an operator API. */}}
{{- if not .Values.operatorApiAddrs }}
{{- fail "the anywhere chart needs at least one operator gRPC API address in operatorApiAddrs (the operator chart renders the Service when phoenixAIOperator.enableApiServer is true)" }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ template "anywhere.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ template "anywhere.name" . }}
spec:
  selector:
    matchLabels:
      app: {{ template "anywhere.name" . }}
  serviceName: {{ template "anywhere.name" . }}-headless
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: anywhere
        # Roll the pod whenever the rendered config file changes — the config
        # is read once at startup, and env vars (which changed the pod spec by
        # themselves) are gone.
        checksum/config: {{ include (print $.Template.BasePath "/secret-config.yaml") . | sha256sum }}
      {{- if .Values.podAnnotations }}
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      {{- end }}
      labels:
        app: {{ template "anywhere.name" . }}
        version: {{ $.Chart.Version }}
    spec:
      automountServiceAccountToken: true
      securityContext:
        # The distroless nonroot uid/gid: makes the data PVC group-writable,
        # so the embedded SQLite can write with readOnlyRootFilesystem on.
        fsGroup: 65532
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 6 }}
      {{- end }}
      containers:
      - name: anywhere
        image: "{{ .Values.image.repository }}:{{ template "anywhere.imageTag" . }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        # All runtime configuration lives in the mounted config file
        # (templates/secret-config.yaml) — there are no PHOENIXAI_ANYWHERE_*
        # environment variables; the image ENTRYPOINT is the bare binary.
        args:
        - --config
        - /etc/phoenixai-anywhere/config/config.yaml
        env:
        - name: TZ
          value: {{ .Values.timeZone | quote }}
        {{- if .Values.env }}
        {{- toYaml .Values.env | nindent 8 }}
        {{- end }}
        ports:
        - containerPort: {{ .Values.httpPort }}
          name: http
          protocol: TCP
        {{- if .Values.securityContext }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        {{- end }}
        # Startup work happens before the HTTP port is opened: the object
        # store is verified end to end (up to 30s) and the support-bundle list
        # is rebuilt from it (up to 75s). Against a slow-but-alive endpoint
        # that is longer than the liveness probe would tolerate, and without a
        # startup probe the kubelet would kill the container just before it
        # starts serving — then again on every restart. This probe owns that
        # window (up to 150s); liveness only takes over once the process has
        # answered once.
        startupProbe:
          httpGet:
            path: /api/v1/health
            port: http
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        # Persistent data (embedded SQLite: usage ledger, future console state).
        - name: data
          mountPath: /var/lib/phoenixai-anywhere
        # The main config file (--config): the rendered config Secret.
        # Inspection selection and the s3/prometheus dependencies are inlined
        # in it — no extra mounts.
        - name: config
          mountPath: /etc/phoenixai-anywhere/config
          readOnly: true
        # Admin Console accounts (key = username -> one file per username);
        # stays a separate Secret directory: read on every login, so rotation
        # needs no restart.
        - name: admin-credentials
          mountPath: /etc/phoenixai-anywhere/admin-credentials
          readOnly: true
      serviceAccountName: {{ template "anywhere.serviceAccountName" . }}
      terminationGracePeriodSeconds: 10
      volumes:
      # Persistent data: the standalone chart-managed PVC (templates/pvc.yaml) or the
      # user's persistence.existingClaim — not a volumeClaimTemplate, whose immutability
      # froze persistence.size at install time (see the rationale in pvc.yaml).
      - name: data
        persistentVolumeClaim:
          claimName: {{ template "anywhere.dataPVCName" . }}
      - name: config
        secret:
          secretName: {{ printf "%s-config" (include "anywhere.name" .) }}
      - name: admin-credentials
        secret:
          secretName: {{ template "anywhere.adminSecretName" . }}
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
