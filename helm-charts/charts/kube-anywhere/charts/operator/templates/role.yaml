{{- if and .Values.phoenixAIOperator.enabled .Values.global.rbac.create }}
{{- if .Values.phoenixAIOperator.watchNamespace }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ template "operator.name" . }}-operator
  namespace: {{ template "operator.namespace" . }}
  labels:
    app: {{ template "operator.name" . }}-operator
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - '*'
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - '*'
- apiGroups:
  - batch
  resources:
  - cronjobs
  verbs:
  - '*'
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - '*'
- apiGroups:
  - ""
  resources:
  - configmaps
  - serviceaccounts
  - services
  verbs:
  - '*'
- apiGroups:
  - ""
  resources:
  - endpoints
  - pods
  - secrets
  verbs:
  - get
  - list
  - watch
# PVC read is granted unconditionally so the query API can list PVCs for the resource tree.
# PVC write (create/update/patch) stays gated behind enablePVCExpansion; see rbac-pvc-expansion.yaml.
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  verbs:
  - get
  - list
  - watch
# Record Warning events (e.g. SyncFeFailed, PVC validation rejections) on the CR.
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - phoenixdata.ai
  resources:
  - phoenixaiclusters
  - phoenixaiwarehouses
  verbs:
  - '*'
# when deploying to OpenShift, the following permission is also necessary
- apiGroups:
  - phoenixdata.ai
  resources:
  - phoenixaiclusters/finalizers
  - phoenixaiwarehouses/finalizers
  verbs:
  - update
- apiGroups:
  - phoenixdata.ai
  resources:
  - phoenixaiclusters/status
  - phoenixaiwarehouses/status
  verbs:
  - get
  - patch
  - update

{{- end }}
{{- end }}
